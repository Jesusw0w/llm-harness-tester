[project]
name = "inject-probe"
description = "Adversarial test harness for prompt injection in LLM applications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jesusw0w" }]
keywords = ["llm", "prompt-injection", "security", "testing", "fuzzing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]
dynamic = ["version"]

[project.scripts]
inject-probe = "inject_probe.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.10", "nox>=2024.4.15", "pytest>=8.0", "ruff>=0.11"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/inject_probe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inject_probe"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade — enforces X | Y over Union
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "ANN",       # missing annotations
    "D",         # pydocstyle
    "RUF",       # ruff-specific
    "S",         # bandit security checks
    "TID",       # tidy imports
    "PTH",       # prefer pathlib over os.path
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D103"]   # assert is fine; test docstrings optional

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples", "noxfile.py"]
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
